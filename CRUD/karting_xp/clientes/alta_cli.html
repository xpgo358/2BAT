<html>
<head>
<meta charset="utf-8" />
<title>Alta Cliente</title>
<link rel="stylesheet" href="../styles.css">

</head>

<body class="form-page">

<a href="../index.html" class="home-icon" title="Volver al inicio">🏠</a>

<div class="container">

    <h1>➕ AGREGAR CLIENTE</h1>

    <form action="alta_cli.php" method="post">

        <div class="form-group">
            <label for="DNI">DNI *</label>
            <input type="text" name="DNI" id="DNI" required>
        </div>

        <div class="form-group">
            <label for="NumLicencia">Número de Licencia *</label>
            <input type="text" name="NumLicencia" id="NumLicencia" required>
        </div>

        <div class="form-group">
            <label for="Nombre">Nombre *</label>
            <input type="text" name="Nombre" id="Nombre" required>
        </div>

        <div class="form-group">
            <label for="Ape1">Primer Apellido *</label>
            <input type="text" name="Ape1" id="Ape1" required>
        </div>

        <div class="form-group">
            <label for="Ape2">Segundo Apellido</label>
            <input type="text" name="Ape2" id="Ape2">
        </div>

        <div class="form-group">
            <label for="Email">Email</label>
            <input type="email" name="Email" id="Email">
        </div>

        <div class="form-group">
            <label for="Telefono">Teléfono</label>
            <input type="tel" name="Telefono" id="Telefono">
        </div>

        <div class="form-group">
            <label for="Direccion">Dirección</label>
            <input type="text" name="Direccion" id="Direccion">
        </div>

        <div class="form-group">
            <label for="FechaRenovacion">Fecha de Renovación</label>
            <input type="date" name="FechaRenovacion" id="FechaRenovacion">
        </div>

        <button type="submit">GUARDAR</button>
        <button type="button" class="button-secondary" onclick="window.location='../index.html'">VOLVER</button>

    </form>

</div>

</body>

</html>
