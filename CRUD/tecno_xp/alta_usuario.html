<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agregar Usuario - TecnoXP</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">
    <h1>⬆️ Agregar Usuario</h1>
    
    <form action="alta_usuario.php" method="post">
        <div class="form-group">
            <label for="id_usuario">ID Usuario:</label>
            <input type="text" name="id_usuario" id="id_usuario" required>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" required>
        </div>

        <div class="form-group">
            <label for="ape1">Primer Apellido:</label>
            <input type="text" name="ape1" id="ape1" required>
        </div>

        <div class="form-group">
            <label for="ape2">Segundo Apellido:</label>
            <input type="text" name="ape2" id="ape2">
        </div>

        <div class="form-group">
            <label for="grupo">Grupo:</label>
            <input type="text" name="grupo" id="grupo" required>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-submit">💾 Guardar</button>
            <button type="reset" class="btn-reset">🔄 Limpiar</button>
            <button type="button" class="btn-back" onclick="window.location='index.html'">🏠 Inicio</button>
        </div>
    </form>
</div>

</body>
</html>
