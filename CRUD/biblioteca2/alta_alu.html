<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alta Alumno</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-image: url('fondo.jpg');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
}

/* Capa de fondo */
.overlay {
    background: rgba(255,255,255,0.9);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Tarjeta */
.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

/* Título */
h2 {
    text-align: center;
    color: #c62828;
    margin-bottom: 20px;
}

/* Inputs */
.input-group {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}

input[type="text"] {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* Botones */
.buttons {
    text-align: center;
    margin-top: 20px;
}

button, input[type="submit"], input[type="reset"], input[type="button"] {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* Colores botones */
.save {
    background-color: #2e7d32;
    color: white;
}

.cancel {
    background-color: #c62828;
    color: white;
}

.back {
    background-color: #1565c0;
    color: white;
}

/* Hover */
button:hover, input:hover {
    opacity: 0.85;
}
</style>

</head>

<body>

<div class="overlay">

<div class="card">
    <h2>👨‍🎓 Alta Alumno</h2>

    <form action="alta_alu.php" method="post">

        <div class="input-group">
            <label>NIA</label>
            <input type="text" name="NIA" required>
        </div>

        <div class="input-group">
            <label>Nombre</label>
            <input type="text" name="Nombre" required>
        </div>

        <div class="input-group">
            <label>Apellido 1</label>
            <input type="text" name="Ape1" required>
        </div>

        <div class="input-group">
            <label>Apellido 2</label>
            <input type="text" name="Ape2">
        </div>

        <div class="input-group">
            <label>Curso</label>
            <input type="text" name="Curso" required>
        </div>

        <div class="buttons">
            <input type="submit" value="💾 Guardar" class="save">
            <input type="reset" value="❌ Cancelar" class="cancel">
            <input type="button" value="🔙 Regresar" class="back" onclick="window.location='index.html'">
        </div>

    </form>
</div>

</div>

</body>
</html>
