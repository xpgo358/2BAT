<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancelar Reserva - TecnoXP</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">
    <h1>🗑️ Cancelar Reserva</h1>
    
    <form action="baja_reserva.php" method="post">
        <div class="form-group">
            <label for="cod_usuario">ID Usuario:</label>
            <input type="text" name="cod_usuario" id="cod_usuario" required>
        </div>

        <div class="form-group">
            <label for="cod_dispositivo">Código Dispositivo:</label>
            <input type="text" name="cod_dispositivo" id="cod_dispositivo" required>
        </div>

        <div class="form-group">
            <label for="fecha_inicio">Fecha Inicio:</label>
            <input type="date" name="fecha_inicio" id="fecha_inicio" required>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-submit">🗑️ Cancelar Reserva</button>
            <button type="button" class="btn-back" onclick="window.location='index.html'">🏠 Inicio</button>
        </div>
    </form>
</div>

</body>
</html>
