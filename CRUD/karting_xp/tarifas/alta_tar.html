<html>
<head>
<meta charset="utf-8" />
<title>Alta Tarifa</title>
<link rel="stylesheet" href="../styles.css">

</head>

<body class="form-page">

<a href="../index.html" class="home-icon" title="Volver al inicio">🏠</a>

<div class="container">

    <h1>➕ AGREGAR TARIFA</h1>

    <form action="alta_tar.php" method="post">

        <div class="form-group">
            <label for="Nombre">Nombre de la Tarifa *</label>
            <input type="text" name="Nombre" id="Nombre" required>
        </div>

        <div class="form-group">
            <label for="PrecioPorPersona">Precio por Persona (€) *</label>
            <input type="number" name="PrecioPorPersona" id="PrecioPorPersona" step="0.01" min="0" required>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" name="Activa" id="Activa" value="1" checked>
            <label for="Activa">Tarifa Activa</label>
        </div>

        <button type="submit">GUARDAR</button>
        <button type="button" class="button-secondary" onclick="window.location='../index.html'">VOLVER</button>

    </form>

</div>

</body>

</html>
