<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agregar Dispositivo - TecnoXP</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">
    <h1>⬆️ Agregar Dispositivo</h1>
    
    <form action="alta_dispositivo.php" method="post">
        <div class="form-group">
            <label for="cod_dispositivo">Código Dispositivo:</label>
            <input type="text" name="cod_dispositivo" id="cod_dispositivo" required>
        </div>

        <div class="form-group">
            <label for="nombre_dispositivo">Nombre Dispositivo:</label>
            <input type="text" name="nombre_dispositivo" id="nombre_dispositivo" required>
        </div>

        <div class="form-group">
            <label for="tipo">Tipo:</label>
            <select name="tipo" id="tipo" required>
                <option value="">Selecciona un tipo</option>
                <option value="Portátil">Portátil</option>
                <option value="Tablet">Tablet</option>
                <option value="Cámara">Cámara</option>
                <option value="Monitor">Monitor</option>
                <option value="Auriculares">Auriculares</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="estado">Estado:</label>
            <select name="estado" id="estado" required>
                <option value="">Selecciona un estado</option>
                <option value="disponible">Disponible</option>
                <option value="mantenimiento">Mantenimiento</option>
            </select>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-submit">💾 Guardar</button>
            <button type="reset" class="btn-reset">🔄 Limpiar</button>
            <button type="button" class="btn-back" onclick="window.location='index.html'">🏠 Inicio</button>
        </div>
    </form>
</div>

</body>
</html>
